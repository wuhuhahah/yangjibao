<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>养基宝 · 首次同步</title><style>body{margin:0;background:#edf3f7;color:#183248;font:15px/1.8 "Microsoft YaHei",sans-serif}main{max-width:900px;margin:40px auto;padding:24px}article{padding:30px;background:white;border-radius:12px}h1{font-size:25px}li{margin:10px 0}</style></head><body><main><article><h1>养基宝 · 首次同步</h1><p>这个便携包不含任何人的持仓数据，首次使用时读取你本机的养基宝Edge插件。</p><ol><li>在Edge安装养基宝插件，登录与APP相同的账号。</li><li>在养基宝APP同步支付宝截图，打开Edge插件确认持仓已更新。</li><li>点击上方“后台刷新数据”。如果使用了其他Edge资料，在后台设置中选择。</li></ol><p>成功后自动进入持仓工作台，保留PE/PB、金叉死叉与量能、四象限等分析。</p></article></main></body></html>
